[upstream]
purl = 'pkg:generic/ghc?url=https://downloads.haskell.org/~ghc/&regex=href="(\d+\.\d+\.\d{1,2})/"'
relocks = [
  "hackage",
] # the version set is a cabal plan for this compiler's boot libraries
allow = "==9.12.*"

[[source]]
key = "x86_64"
url = "https://downloads.haskell.org/~ghc/{version}/ghc-{version}-x86_64-deb12-linux.tar.xz"
hash = "sha256-CiRLfu+lNf9RIJ7NSz9ho1cz0m8pPA7DGpE08peh0DU="

[[source]]
key = "aarch64"
url = "https://downloads.haskell.org/~ghc/{version}/ghc-{version}-aarch64-deb12-linux.tar.xz"
hash = "sha256-HQs61CKq9/z0rhvOpxK+N2iwudhDsUUmfawESxgJC0Q="

[pin]
version = "9.12.4"
